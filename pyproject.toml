[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icia"
version = "0.1.0"
description = "Intention-Centred Intelligence Architecture (ICIA) - Post-Transformer AI Paradigm"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Foundational AI Architecture Research Consortium", email = "research@icia.ai" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
icia = "icia.cli:main"

[tool.setuptools.packages.find]
include = ["icia*"]
