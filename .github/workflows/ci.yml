name: ICIA CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy<2" pytest matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Verify ICIA CLI Tool
        run: |
          icia --help
          icia scorecard

  hardware-verification:
    name: C99 & Verilog Tier Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile & Simulate Q16.16 RTL Testbench
        run: |
          iverilog -g2001 -o /tmp/tb.vvp hardware/icia_riemannian_core.v hardware/tb_icia_riemannian_core.v
          vvp /tmp/tb.vvp | tee /tmp/tb.out
          grep -q "SUCCESS: Test 1" /tmp/tb.out
          grep -q "SUCCESS: Test 2" /tmp/tb.out

      - name: Compile & Run C99 Single-Header Engine
        run: |
          printf '#define ICIA_CORE_IMPLEMENTATION\n#include "include/icia_core.h"\n#include <stdio.h>\nint main(void){icia_system_t s;float g[4]={0,0,0,0};icia_init(&s,g);printf("%%f\\n",(double)icia_compute_control(&s));return 0;}\n' > /tmp/smoke.c
          gcc -std=c99 -Wall -Wextra /tmp/smoke.c -o /tmp/smoke
          /tmp/smoke

  build-dist:
    name: Build Distribution Packages (sdist & wheel)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Package
        run: |
          pip install build
          python -m build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icia-dist
          path: dist/
